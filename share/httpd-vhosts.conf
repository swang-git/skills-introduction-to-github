# Virtual Hosts
#
# Required modules: mod_log_config

# If you want to maintain multiple domains/hostnames on your
# machine you can setup VirtualHost containers for them. Most configurations
# use only name-based virtual hosts so the server doesn't need to worry about
# IP addresses. This is indicated by the asterisks in the directives below.
#
# Please see the documentation at
# <URL:http://httpd.apache.org/docs/2.4/vhosts/>
# for further details before you try to setup virtual hosts.
#
# You may use the command line option '-S' to verify your virtual host
# configuration.

#
# VirtualHost example:
# Almost any Apache directive may go into a VirtualHost container.
# The first VirtualHost section is used for all requests that do not
# match a ServerName or ServerAlias in any <VirtualHost> block.
#

# <VirtualHost *:80>
#    ServerAdmin webmaster@dummy-host.example.com
#    DocumentRoot "c:/Apache24/docs/dummy-host.example.com"
#    ServerName dummy-host.example.com
#    ServerAlias www.dummy-host.example.com
#    ErrorLog "logs/dummy-host.example.com-error.log"
#    CustomLog "logs/dummy-host.example.com-access.log" common
#</VirtualHost>

<VirtualHost *:80>
  # Options FollowSymLinks MultiViews ExecCGI
  ServerAdmin swang71@comcast.net
  ServerName prod
  ##DocumentRoot "/var/www/html/prod/public"
  DocumentRoot "/sites/prod/public"
  # ServerAlias 71.59.72.103
  # ServerAlias localhost
  ###ServerAlias 192.168.1.116
  ServerAlias 69.141.101.98
  ErrorLog "/var/log/httpd/prod-error_log"
  CustomLog "/var/log/httpd/prod-access_log" common
  ##<Directory "/var/www/html/prod/public">
  <Directory "/sites/prod/public">
    RewriteEngine On
    AllowOverride All
    Options FollowSymLinks MultiViews ExecCGI
    Require all granted

    RewriteCond %{HTTP_HOST} ^www\.(.+)$ [NC]
    RewriteRule ^ http://%1%{REQUEST_URI} [R=301,L]

    RewriteCond %{QUERY_STRING} ^(.*)
    RewriteRule ^([a-z]{2,10})/$ /?controller=$1&%1

    RewriteCond %{QUERY_STRING} ^(.*)
    RewriteRule ^([a-z]{2,10})/([a-z]{1,20})/$ /?controller=$1&action=$2&%1

    #Remove Index.html
    RewriteCond %{THE_REQUEST} ^GET\ .*/index\.php
    RewriteRule ^(.*)index\.php$ /$1 [R=301,L]
  </Directory>
  # Puts here, before Directory directive :)
  Alias /daily_data "/sites/webdata/daily_data"
  <Directory "/sites/webdata/daily_data">
    Options FollowSymLinks MultiViews ExecCGI
    AllowOverride All
    Require all granted
  </Directory>
  Alias /docs "/sites/webdata/docs"
  <Directory "/sites/webdata/docs">
    Require all granted
  </Directory>
  Alias /pics "/sites/webdata/pics"
  <Directory "/sites/webdata/pics">
    Require all granted
  </Directory>
</VirtualHost>

