<VirtualHost *:80>
  Options FollowSymLinks MultiViews ExecCGI
  # Header edit Set-Cookie ^(.*)$ "$1; 3pcookie=value; SameSite=None; Secure"
  ServerAdmin swang71@comcast.net
  DocumentRoot "/var/www/html/devx/public"
  # DocumentRoot "/home/swang/devx/public"
  # ServerAlias localhost
  ServerAlias 192.168.1.138
  # ServerAlias 127.0.0.1
  ServerName devx
  ErrorLog "/var/log/httpd/devx-error_log"
  CustomLog "/var/log/httpd/devx-access_log" common
  <Directory "/var/www/html/devx/public">
  # <Directory "/home/swang/devx/public">
    RewriteEngine On
    AllowOverride All
    Options Indexes FollowSymLinks MultiViews ExecCGI
    Require all granted

    RewriteCond %{HTTP_HOST} ^www\.(.+)$ [NC]
    RewriteRule ^ http://%1%{REQUEST_URI} [R=301,L]

    RewriteCond %{QUERY_STRING} ^(.*)
    RewriteRule ^([a-z]{2,10})/$ /?controller=$1&%1

    RewriteCond %{QUERY_STRING} ^(.*)
    RewriteRule ^([a-z]{2,10})/([a-z]{1,20})/$ /?controller=$1&action=$2&%1

    #Remove Index.html
    RewriteCond %{THE_REQUEST} ^GET\ .*/index\.php
    RewriteRule ^(.*)index\.php$ /$1 [R=301,L]
  </Directory>
  # Puts here, before Directory directive :)
  Alias /daily_data "/sites/webdata/daily_data"
  <Directory "/sites/webdata/daily_data">
    Options FollowSymLinks MultiViews ExecCGI
    AllowOverride All
    Require all granted
  </Directory>
  Alias /docs "/sites/webdata/docs"
  <Directory "/sites/webdata/docs">
    Options FollowSymLinks MultiViews ExecCGI
    AllowOverride All
    Require all granted
  </Directory>
  Alias /pics "/sites/webdata/pics"
  <Directory "/sites/webdata/pics">
    Options FollowSymLinks MultiViews ExecCGI
    AllowOverride All
    Require all granted
  </Directory>
</VirtualHost>
