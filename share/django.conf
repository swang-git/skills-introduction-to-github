<VirtualHost *:80>
    ServerAdmin swang7@comcast.net
    # DocumentRoot /home/swang/django_quasar/article/templates
    DocumentRoot /var/www/html
    ServerName django
#   ServerAlias www.django
    ServerAlias 192.168.1.137

    WSGIScriptAlias / /home/swang/django_quasar/django_quasar/wsgi.py
    <Directory /home/swang/django_quasar/article/templates>
        # Order allow,deny
        # Allow from all
        RewriteEngine On
        AllowOverride All
        Options Indexes FollowSymLinks MultiViews ExecCGI
        Require all granted

        RewriteCond %{HTTP_HOST} ^www\.(.+)$ [NC]
        RewriteRule ^ http://%1%{REQUEST_URI} [R=301,L]
        RewriteCond %{QUERY_STRING} ^(.*)
        RewriteRule ^([a-z]{2,10})/$ /?controller=$1&%1

        RewriteCond %{QUERY_STRING} ^(.*)
        RewriteRule ^([a-z]{2,10})/([a-z]{1,20})/$ /?controller=$1&action=$2&%1

        #Remove Index.html
        RewriteCond %{THE_REQUEST} ^GET\ .*/index\.html
        RewriteRule ^(.*)index\.html$ /$1 [R=301,L]
    </Directory>

    Alias /robots.txt /home/swang/django_quasar/article/templates/robots.txt
    Alias /favicon.ico /home/swang/django_quasar/article/templates/favicon.ico
    Alias /images /home/swang/django_quasar/article/templates/images
    Alias /static /home/swang/django_quasar/article/templates/static

    ErrorLog /var/log/django-error.log
    CustomLog /var/log/django-access.log combined
</VirtualHost>

